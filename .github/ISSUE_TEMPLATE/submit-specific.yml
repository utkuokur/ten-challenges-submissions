name: Submit a proof for a specific r
description: Submit a Lean 4 proof of one challenge at a specific value of the parameter r.
labels:
  - submission
body:
  - type: markdown
    attributes:
      value: |
        Submit a proof of one of the parametrized challenges at a
        **specific** value of `r`. If you're settling the universal
        ∀r form, use the "Submit a proof of the universal conjecture"
        form instead.

        Provide your proof as a **GitHub repository** containing a
        `Submission/Main.lean` (with the relevant `r` and
        `theorem challenge_N` inside `namespace Submission`), plus any
        helpers as `Submission/<Name>.lean`.

        **For private submissions,** use a **private** GitHub repo and
        install the `ten-challenges-bot` GitHub App on it so the CI
        can clone it.

  - type: input
    id: repo_url
    attributes:
      label: Repository URL
      placeholder: https://github.com/me/my-proofs
    validations:
      required: true

  - type: dropdown
    id: problem_id
    attributes:
      label: Problem
      description: Which challenge are you targeting?
      options:
        - challenge_1
        - challenge_2
        - challenge_3
        - challenge_4
        - challenge_5
        - challenge_6
        - challenge_7
        - challenge_8
        - challenge_9
        - challenge_10
    validations:
      required: true

  - type: input
    id: parameter
    attributes:
      label: Chosen parameter r
      description: The value of `r` your proof establishes.
      placeholder: e.g. 5
    validations:
      required: true

  - type: input
    id: bound
    attributes:
      label: Chosen bound B
      description: Challenge 2 only — the bound `B` on the number of excluded minors your proof establishes (the pair `r`, `B` is recorded).
      placeholder: e.g. 7
    validations:
      required: false

  - type: input
    id: nickname
    attributes:
      label: Nickname
      description: Display name for the leaderboard.
      placeholder: lean_enjoyer
    validations:
      required: true

  - type: input
    id: full_name
    attributes:
      label: Full name (optional)
      description: Shown next to your nickname if provided.
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I understand the CI will shallow-clone the repository above and run `lake build`. I understand my nickname, name, problem, claim, and parameter will be published on the public leaderboard. I understand that an encrypted copy of my submission source is retained indefinitely in a private audit repository, decryptable only by the maintainers, for soundness auditing and compatibility maintenance. I authorize the competition maintainers to retain and modify copies of my submission solely for compatibility with future Lean and library versions, preserving authorship, the mathematical claim, and its public or private status.
          required: true
