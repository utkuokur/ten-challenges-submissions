name: Shim drift check

# The canonical theorem statements (TenChallenges/ten-challenges) and the CHECKS
# templates in scripts/generate_check.py hold the same signatures in two
# places, and they must move in lockstep. This workflow rebuilds every shim
# against a mock submission that re-exports the canonical (sorry-backed)
# theorem; a template that drifted fails with a type error, while an in-sync
# one fails at the expected placeholder gates (axioms, and Challenge 2 data).
# See scripts/shim_drift_check.py.
#
# The mirror-image workflow in TenChallenges/ten-challenges runs the same script
# on every push that touches Challenges/** — that side catches canon edits,
# this side catches template edits.

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_check.py"
      - "scripts/ordinal_report.py"
      - "scripts/ordinal_parameters.py"
      - "scripts/shim_drift_check.py"
      - "scripts/verified_metadata.py"
      - "scripts/append_leaderboard.py"
      - "scripts/record_leaderboard.py"
      - "scripts/record_queue.py"
      - "scripts/maintenance_consent.py"
      - "scripts/write_metadata.py"
      - "scripts/archive_submission.py"
      - ".github/ISSUE_TEMPLATE/**"
      - "tests/**"
      - ".github/workflows/submission.yml"
      - ".github/workflows/record.yml"
      - ".github/workflows/shim-drift.yml"
  workflow_dispatch:
  schedule:
    # Weekly safety net in case a canon-side push slipped past the mirror
    # workflow (e.g. it was edited or skipped).
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: shim-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test verified submission metadata
        run: python3 -m unittest discover -s tests -v

      - uses: actions/checkout@v4
        with:
          repository: TenChallenges/ten-challenges
          ref: main
          path: lean-challenge
          persist-credentials: false

      - name: Install elan
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        working-directory: lean-challenge
        run: lake exe cache get || true

      - name: Check every shim against the canon
        run: python3 scripts/shim_drift_check.py --project lean-challenge

      - name: Check proof-derived leaderboard parameters
        run: python3 tests/integration_verified_parameter.py --project lean-challenge

      - name: Check standard ordinal normalization
        run: python3 tests/integration_ordinal_parameters.py --project lean-challenge

      - name: Smoke-test accepted and rejected submissions
        run: python3 tests/integration_submission_smoke.py --project lean-challenge
